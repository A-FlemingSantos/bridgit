spring:
  application:
    name: bridgit-api
  http:
    client:
      connect-timeout: 5s
      read-timeout: 30s
      redirects: dont-follow
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=bridgit_db;encrypt=false;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          time_zone: UTC
        format_sql: true
  jackson:
    locale: pt_BR
    time-zone: America/Sao_Paulo
  flyway:
    enabled: true

server:
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-local-jwt-secret-change-me-00000000000000000000000000000000}
    issuer: bridgit-api
    access-token-minutes: 180
  time:
    zone-id: America/Sao_Paulo
  integrations:
    token-key-base64: ${APP_INTEGRATION_TOKEN_KEY_B64:}
  providers:
    state-minutes: 10
    onedrive:
      client-id: ${APP_ONEDRIVE_CLIENT_ID:}
      client-secret: ${APP_ONEDRIVE_CLIENT_SECRET:}
      redirect-uri: ${APP_ONEDRIVE_REDIRECT_URI:http://localhost:8080/api/providers/onedrive/callback}
    google-drive:
      client-id: ${APP_GOOGLE_DRIVE_CLIENT_ID:}
      client-secret: ${APP_GOOGLE_DRIVE_CLIENT_SECRET:}
      redirect-uri: ${APP_GOOGLE_DRIVE_REDIRECT_URI:http://localhost:8080/api/providers/google-drive/callback}
    dropbox:
      client-id: ${APP_DROPBOX_CLIENT_ID:}
      client-secret: ${APP_DROPBOX_CLIENT_SECRET:}
      redirect-uri: ${APP_DROPBOX_REDIRECT_URI:http://localhost:8080/api/providers/dropbox/callback}
