spring:
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: bridgit-api
  http:
    client:
      connect-timeout: 5s
      read-timeout: 30s
      redirects: dont-follow
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=bridgit_db;encrypt=false;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          time_zone: UTC
        format_sql: true
  jackson:
    locale: pt_BR
    time-zone: America/Sao_Paulo
  flyway:
    enabled: true

server:
  tomcat:
    # Lets Tomcat read the rest of an upload it already answered (for instance a 400 for a missing
    # part), so the client sees the error instead of a dropped connection. Matches max-request-size.
    max-swallow-size: 52MB
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  hub:
    catalog-enabled: ${APP_HUB_CATALOG_ENABLED:true}
    operations-enabled: ${APP_HUB_OPERATIONS_ENABLED:true}
    worker-enabled: ${APP_HUB_WORKER_ENABLED:true}
    direct-read-enabled: ${APP_HUB_DIRECT_READ_ENABLED:true}
    content-cache-enabled: ${APP_HUB_CONTENT_CACHE_ENABLED:true}
    webhook-base-url: ${APP_HUB_WEBHOOK_BASE_URL:}
    upload-directory: ${APP_HUB_UPLOAD_DIRECTORY:./data/pending-uploads}
    # Total / per-user bytes of uploads waiting to be sent to the provider (5 GiB / 500 MiB).
    upload-global-bytes: ${APP_HUB_UPLOAD_GLOBAL_BYTES:5368709120}
    upload-user-bytes: ${APP_HUB_UPLOAD_USER_BYTES:524288000}
    # Comma-separated provider ids (onedrive, google-drive, dropbox) to turn off.
    disabled-providers: ${APP_HUB_DISABLED_PROVIDERS:}
    # While someone uses a connection (an open app or a listing), its sync is pulled forward at most this often.
    # Lower shows outside changes sooner; each pull is one provider call plus a catalog write.
    nudge-seconds: ${APP_HUB_NUDGE_SECONDS:5}
    # Poll intervals (ms) of the background jobs.
    worker-poll-ms: ${APP_HUB_WORKER_POLL_MS:2000}
    watch-poll-ms: ${APP_HUB_WATCH_POLL_MS:60000}
    operation-poll-ms: ${APP_HUB_OPERATION_POLL_MS:500}
    upload-cleanup-poll-ms: ${APP_HUB_UPLOAD_CLEANUP_POLL_MS:5000}
    # Periodic deletion of rows that only accumulate (cloud_events, user_sessions, provider_oauth_states).
    retention:
      enabled: ${APP_HUB_RETENTION_ENABLED:true}
      poll-ms: ${APP_HUB_RETENTION_POLL_MS:3600000}
      initial-delay-ms: ${APP_HUB_RETENTION_INITIAL_DELAY_MS:60000}
      # Event log rows older than this are removed; clients only ask for recent events.
      events-days: ${APP_HUB_RETENTION_EVENTS_DAYS:7}
      # Sessions revoked, or expired, for longer than this are removed.
      sessions-days: ${APP_HUB_RETENTION_SESSIONS_DAYS:30}
      # OAuth states used, or expired, for longer than this are removed.
      oauth-states-hours: ${APP_HUB_RETENTION_OAUTH_STATES_HOURS:24}
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  public-links:
    # Per link and visitor address, metadata and content together.
    max-accesses-per-minute: ${APP_PUBLIC_LINKS_MAX_ACCESSES_PER_MINUTE:60}
    # Per link across all visitors, to protect the owner's provider quota.
    max-accesses-per-link-per-minute: ${APP_PUBLIC_LINKS_MAX_ACCESSES_PER_LINK_PER_MINUTE:600}
    # Lookups from one address that matched no link, against guessing aliases and codes.
    max-failed-lookups: ${APP_PUBLIC_LINKS_MAX_FAILED_LOOKUPS:20}
    failed-lookup-window-minutes: ${APP_PUBLIC_LINKS_FAILED_LOOKUP_WINDOW_MINUTES:15}
  # Comma-separated URL prefixes the OAuth flow may return to. Expo Go needs its exp:// address added in development.
  mobile-redirect-prefixes: ${APP_MOBILE_REDIRECT_PREFIXES:bridgit://}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${APP_JWT_SECRET:}
    issuer: bridgit-api
  integrations:
    token-key-base64: ${APP_INTEGRATION_TOKEN_KEY_B64:}
  providers:
    state-minutes: 10
    onedrive:
      client-id: ${APP_ONEDRIVE_CLIENT_ID:}
      client-secret: ${APP_ONEDRIVE_CLIENT_SECRET:}
      redirect-uri: ${APP_ONEDRIVE_REDIRECT_URI:http://localhost:8080/api/providers/onedrive/callback}
    google-drive:
      client-id: ${APP_GOOGLE_DRIVE_CLIENT_ID:}
      client-secret: ${APP_GOOGLE_DRIVE_CLIENT_SECRET:}
      redirect-uri: ${APP_GOOGLE_DRIVE_REDIRECT_URI:http://localhost:8080/api/providers/google-drive/callback}
    dropbox:
      client-id: ${APP_DROPBOX_CLIENT_ID:}
      client-secret: ${APP_DROPBOX_CLIENT_SECRET:}
      redirect-uri: ${APP_DROPBOX_REDIRECT_URI:http://localhost:8080/api/providers/dropbox/callback}
